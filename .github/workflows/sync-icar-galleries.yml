name: Sync iCar Gezina vehicle galleries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync direct iCar Gezina galleries
        env:
          SUPABASE_URL: https://srlnoxhqudgvskntekze.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DELAY_MS: 350
        run: node scripts/sync-icar-galleries.mjs
